name: Offline portability
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: Also download and verify the pinned original runtime
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned local environment
        run: ./setup.sh code
      - name: Portable and original mixed-C checks (no API)
        run: .venv/bin/python -B tools/test_offline.py
      - name: Install original runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime }}
        run: .venv/bin/python tools/runtime.py install
      - name: Verify actual original index and wiring (network blocked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime }}
        run: .venv/bin/python -B tools/check.py --runtime
